name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify workflow files are valid YAML
        run: |
          for wf in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$wf'))" || exit 1
            echo "✓ $wf"
          done
      - name: Verify caller template is valid
        run: |
          python3 -c "
          import yaml
          with open('.github/workflows/ci.yml') as f:
              yaml.safe_load(f)
          print('✓ ci.yml valid')
          "
