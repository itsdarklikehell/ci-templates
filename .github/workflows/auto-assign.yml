name: Auto Assign

# SECURITY: pull_request_target gives access to secrets. This workflow only
# uses github-script to add an assignee to the PR — no arbitrary code execution.
# The script is hardcoded and does not use any untrusted input.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ['itsdarklikehell']
            })
